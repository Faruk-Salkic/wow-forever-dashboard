name: 🗡️ WoW Forever Updates

on:
  schedule:
    # First two launch weeks: every two hours. Then the daily event is selected.
    - cron: "17 */2 * * *"
      timezone: "Europe/Vienna"
    - cron: "50 11 * * *"
      timezone: "Europe/Vienna"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'scraper/**'
      - 'data/guide_sources.json'
      - 'data/update_policy.json'
      - 'data/dungeon_overrides.json'
      - 'data/editorial_updates.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  schedule_policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_update: ${{ steps.policy.outputs.run_update }}
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: policy
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: python scraper/update_policy.py

  scrape:
    needs: schedule_policy
    if: needs.schedule_policy.outputs.run_update == 'true'
    name: 🔍 Scrape, Validate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Log execution timing & runner delay
        run: |
          TARGET_SCHEDULE="${{ github.event.schedule || 'manual/push' }} · ${{ needs.schedule_policy.outputs.mode }} · Europe/Vienna"
          CURRENT_VIENNA=$(TZ="Europe/Vienna" date '+%Y-%m-%d %H:%M:%S %Z')
          CURRENT_UTC=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "⏰ Scheduled trigger target: $TARGET_SCHEDULE"
          echo "🚀 Actual runner start time (Europe/Vienna): $CURRENT_VIENNA"
          echo "🌐 Actual runner start time (UTC): $CURRENT_UTC"
          echo "📋 GitHub event name: ${{ github.event_name }}"

      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: 📚 Check current leveling & talent guides
        run: python scraper/check_guides.py

      - name: 🎁 Check new quests and changed item rewards
        run: python scraper/check_quest_rewards.py

      - name: 🏰 Verify dungeon quest preparation
        run: python scraper/check_dungeons.py

      - name: 🔍 Run scraper & AI validator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX_CALLS: "10"
        run: |
          python scraper/probe_gemini.py
          python scraper/scrape.py
          python scraper/publish_editorial.py

      - name: 🧪 Verify data integrity
        run: |
          python test_dashboard.py
          python test_new_structure.py
          python -m unittest discover -s tests -p 'test_*.py'
          node scripts/check_frontend.js
          node --test tests/*.test.js

      - name: 💾 Commit & push
        run: |
          git config --global user.name  "WoW-Bot 🤖"
          git config --global user.email "wow-bot@faruk-mirza.github.io"
          git add data/feed.json data/news.json data/seen_ids.json data/guides.json data/bis.json data/recommendations.json data/quest_rewards.json data/quest_reward_state.json
          git diff --cached --quiet || git commit -m "🗞️ Verified update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # GITHUB_TOKEN commits do not trigger a branch-based Pages build on their own.
      - name: 🌐 Publish daily data on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_URL=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.url')
          for attempt in $(seq 1 36); do
            STATUS=$(gh api "$BUILD_URL" --jq '.status')
            echo "Pages build: $STATUS"
            case "$STATUS" in
              built) exit 0 ;;
              errored) echo "Pages publication failed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Pages publication did not finish within six minutes"
          exit 1
