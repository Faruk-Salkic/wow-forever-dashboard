name: 🗡️ WoW Forever Daily News Scraper

on:
  schedule:
    # 09:50 UTC (in CEST/Summer = 11:50 Vienna) and 10:50 UTC (in CET/Winter = 11:50 Vienna)
    # Automatic daylight saving time (DST) adjustment via Europe/Vienna timezone gate check.
    # Running at :50 allows ~10 minutes for scraping, tests and GitHub Pages deployment so updates are live by 12:00.
    - cron: "50 9,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: ⏰ Timezone Gate (Europe/Vienna 12:00 Target)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: 🌐 Check Europe/Vienna Local Time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger (workflow_dispatch) - running immediately."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VIENNA_TIME=$(TZ="Europe/Vienna" date '+%Y-%m-%d %H:%M:%S %Z')
          VIENNA_HOUR=$(TZ="Europe/Vienna" date +'%H')
          echo "Current Europe/Vienna local time: $VIENNA_TIME"
          echo "Vienna Hour: $VIENNA_HOUR"

          # Target window is 11:xx Europe/Vienna (leading up to 12:00)
          if [ "$VIENNA_HOUR" -eq 11 ]; then
            echo "✅ Target hour 11 verified. Proceeding with daily 12:00 publication."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ Current Vienna hour ($VIENNA_HOUR) is outside target window (11:50 CET/CEST). Skipping this cron trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    name: 🔍 Scrape, Validate & Deploy
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: 🔍 Run scraper & AI validator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape.py

      - name: 🧪 Verify data integrity
        run: python test_dashboard.py

      - name: 💾 Commit & push
        run: |
          git config --global user.name  "WoW-Bot 🤖"
          git config --global user.email "wow-bot@faruk-mirza.github.io"
          git add data/news.json data/seen_ids.json data/guides.json data/bis.json || true
          git diff --cached --quiet || git commit -m "🗞️ Daily verified update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
