name: 🗡️ WoW Forever Daily News Scraper

on:
  schedule:
    - cron: "0 8 * * *"   # 09:00 CET / 10:00 CEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: 🔍 Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape.py

      - name: 💾 Commit & push
        run: |
          git config --global user.name  "WoW-Bot 🤖"
          git config --global user.email "wow-bot@faruk-mirza.github.io"
          git add data/news.json data/seen_ids.json data/bis.json || true
          git diff --cached --quiet || git commit -m "🗞️ Daily update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
